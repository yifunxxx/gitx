[package]
name = "gitx-git"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "GitRunner, RepoScheduler, progress/stderr parsers (CLI-first)"

[dependencies]
gitx-core = { workspace = true }
gitx-diff = { workspace = true }
gitx-meta = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
regex = "1"
libc = "0.2"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
gitx-testkit = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tokio-util = { workspace = true }
