# Build unsigned Windows installers (NSIS .exe + MSI) on windows-latest.
#
# Triggers:
#   - workflow_dispatch (optional version input → GitHub Release)
#   - push to master → Artifacts only
#   - version tags (v*) → Artifacts + GitHub Release
#
# Tauri 2 + Cargo workspace: bundles land at repo-root
#   target/release/bundle/{nsis,msi}/
# (not under src-tauri/target/).
#
# Releases use GITHUB_TOKEN only (no extra secrets).
name: Release Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional release version (e.g. 0.1.0 or v0.1.0). Empty = artifacts only."
        required: false
        type: string
        default: ""
  push:
    branches: [master]
    tags: ["v*"]

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installers
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # version comes from package.json "packageManager" (pnpm@10.33.4)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@1.90.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # windows-latest includes MSVC Build Tools and WebView2 Runtime.
      # Tauri NSIS/MSI can also ship the WebView2 bootstrapper for end users.
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows app (NSIS + MSI)
        run: pnpm tauri:build

      - name: Stage installers for upload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path staging/nsis, staging/msi | Out-Null

          $candidates = @(
            "target/release/bundle",
            "src-tauri/target/release/bundle"
          )

          Write-Host "=== Searching bundle trees ==="
          foreach ($root in $candidates) {
            if (Test-Path $root) {
              Get-ChildItem -Recurse $root -ErrorAction SilentlyContinue |
                Select-Object FullName, Length |
                Format-Table -AutoSize | Out-String | Write-Host
            } else {
              Write-Host "missing: $root"
            }
          }

          $nsis = @()
          $msi = @()
          foreach ($root in $candidates) {
            if (Test-Path "$root/nsis") {
              $nsis += Get-ChildItem "$root/nsis" -Filter *.exe -ErrorAction SilentlyContinue
            }
            if (Test-Path "$root/msi") {
              $msi += Get-ChildItem "$root/msi" -Filter *.msi -ErrorAction SilentlyContinue
            }
          }

          if ($nsis.Count -eq 0 -or $msi.Count -eq 0) {
            Write-Host "=== FALLBACK: any *.exe / *.msi under **/bundle/** ==="
            Get-ChildItem -Recurse -Path . -Include *.exe,*.msi -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '[\\/]bundle[\\/]' } |
              ForEach-Object { Write-Host $_.FullName }
            throw "Expected NSIS .exe and MSI under target/release/bundle (workspace root). See listing above."
          }

          $nsis | Copy-Item -Destination staging/nsis/ -Force
          $msi | Copy-Item -Destination staging/msi/ -Force
          Write-Host "Staged NSIS:"
          Get-ChildItem staging/nsis | Format-Table Name, Length
          Write-Host "Staged MSI:"
          Get-ChildItem staging/msi | Format-Table Name, Length

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: gitx-windows-nsis
          path: staging/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: gitx-windows-msi
          path: staging/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      # Normalize optional workflow_dispatch version to a v* tag name.
      - name: Resolve release tag
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          create=false
          tag=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            create=true
            tag="${GITHUB_REF_NAME}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            raw="${{ inputs.version }}"
            raw="$(echo -n "${raw}" | tr -d '[:space:]')"
            if [[ -n "${raw}" ]]; then
              create=true
              if [[ "${raw}" == v* ]]; then
                tag="${raw}"
              else
                tag="v${raw}"
              fi
            fi
          fi
          echo "create=${create}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved create=${create} tag=${tag}"

      - name: Create GitHub Release
        if: steps.release_meta.outputs.create == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: gitx ${{ steps.release_meta.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            staging/nsis/*.exe
            staging/msi/*.msi
          body: |
            ## gitx ${{ steps.release_meta.outputs.tag }}

            First public Windows installers for the M0–M8 desktop baseline (focused Git GUI on Tauri 2 + Vue 3 + Rust).

            ### Downloads
            - **NSIS** (`.exe` setup) — recommended for most users
            - **MSI** — for managed / enterprise installs

            Builds are **unsigned**; Windows SmartScreen may warn — choose **More info** → **Run anyway**.

            ### Milestone notes
            Covers M0–M8: core Git flows, Local Changes, History / Graph, multi-root worktrees, Settings / Keymap / themes / zh-CN default. See `docs/dev-plan/08-milestones.md` in the repo.

            App version is aligned with this tag (`0.1.0` ↔ `v0.1.0`).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
